<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SUCOIN X - Deposit</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 18px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 24px;
  font-weight: bold;
}

.back {
  color: white;
  text-decoration: none;
  font-weight: bold;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 30px 18px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h1 {
  margin-bottom: 10px;
}

.note {
  color: #6b7280;
  margin-bottom: 25px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 16px;
  margin-bottom: 18px;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: #16a34a;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.99);
}

.message {
  margin-top: 18px;
  padding: 12px;
  border-radius: 8px;
  display: none;
}

.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.demo {
  margin-top: 20px;
  padding: 14px;
  background: #eff6ff;
  color: #1e40af;
  border-radius: 8px;
}
</style>
</head>

<body>

<header>
  <div class="logo">SUCOIN X</div>
  <a class="back" href="index.html">← Dashboard</a>
</header>

<div class="container">

  <div class="card">

    <h1>Deposit</h1>

    <p class="note">
      Add funds to your SUCOIN X wallet.
    </p>

    <div class="demo">
      🟢 Demo Mode — No real money is processed.
    </div>

    <br>

    <label for="amount">Deposit Amount (₹)</label>

    <input
      type="number"
      id="amount"
      placeholder="Enter amount"
      min="1"
    >

    <button onclick="deposit()">
      Deposit
    </button>

    <div id="message" class="message"></div>

  </div>

</div>

<script>
<script>

function deposit() {

  const amount = Number(
    document.getElementById("amount").value
  );

  const message =
    document.getElementById("message");

  if (!amount || amount <= 0) {

    message.className = "message success";
    message.style.background = "#fee2e2";
    message.style.color = "#991b1b";
    message.textContent = "Please enter a valid amount.";

    return;
  }

  // Current demo balance
  let balance =
    Number(localStorage.getItem("demoBalance")) || 1000000;

  // Add deposit
  balance += amount;

  // Save new balance
  localStorage.setItem("demoBalance", balance);

  // Save transaction
  const transactions =
    JSON.parse(localStorage.getItem("transactions") || "[]");

  transactions.unshift({
    type: "Deposit",
    amount: amount,
    status: "Completed",
    date: new Date().toLocaleString("en-IN")
  });

  localStorage.setItem(
    "transactions",
    JSON.stringify(transactions)
  );

  message.className = "message success";
  message.style.background = "#dcfce7";
  message.style.color = "#166534";

  message.textContent =
    "Demo deposit of ₹" +
    amount.toLocaleString("en-IN") +
    " added successfully.";

  document.getElementById("amount").value = "";
}

</script>

</body>
</html>
