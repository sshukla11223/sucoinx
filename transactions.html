<!DOCTYPE html>

<title>SUCOIN X - Transactions</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {

  color: #111827;
}

header {

}

.logo {

}

.back {

}

.container {

}

h1 {

.card {

  border-radius: 15px;

.transaction {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 0;
  border-bottom: 1px solid #e5e7eb;
}

.transaction:last-child {
  border-bottom: none;
}

.type {
  font-weight: bold;
  font-size: 17px;
}

.date {
  color: #6b7280;
  font-size: 13px;
  margin-top: 5px;
}

.amount {
  font-weight: bold;
  font-size: 17px;
}

.deposit {
  color: #16a34a;
}

.withdraw {
  color: #dc2626;
}

.trade {
  color: #2563eb;
}

.status {
  font-size: 12px;
  margin-top: 5px;
  color: #16a34a;
}

.empty {
  text-align: center;
  color: #6b7280;
  padding: 35px 10px;
}

@media (max-width: 600px) {
  .transaction {
    gap: 15px;
  }

  .amount {
    font-size: 15px;
  }
}
</style>
</head>
