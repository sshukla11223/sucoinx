<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SUCOIN X - Transactions</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 18px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 24px;
  font-weight: bold;
}

.back {
  color: white;
  text-decoration: none;
  font-weight: bold;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 25px 18px;
}

h1 {
  margin-bottom: 20px;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.transaction {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 0;
  border-bottom: 1px solid #e5e7eb;
}

.transaction:last-child {
  border-bottom: none;
}

.type {
  font-weight: bold;
  font-size: 17px;
}

.date {
  color: #6b7280;
  font-size: 13px;
  margin-top: 5px;
}

.amount {
  font-weight: bold;
  font-size: 17px;
}

.deposit {
  color: #16a34a;
}

.withdraw {
  color: #dc2626;
}

.trade {
  color: #2563eb;
}

.status {
  font-size: 12px;
  margin-top: 5px;
  color: #16a34a;
}

.empty {
  text-align: center;
  color: #6b7280;
  padding: 35px 10px;
}

@media (max-width: 600px) {
  .transaction {
    gap: 15px;
  }

  .amount {
    font-size: 15px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">SUCOIN X</div>
  <a class="back" href="index.html">← Dashboard</a>
</header>

<div class="container">

  <h1>Transaction History</h1>

  <div class="card">

    <div id="transactionList"></div>
      <div id="transactionList"></div>

</div>
</div>

<script>
function loadTransactions() {
    const list = document.getElementById("transactionList");

    const transactions =
        JSON.parse(localStorage.getItem("transactions") || "[]");

    if (transactions.length === 0) {
        list.innerHTML =
            '<div class="empty">No transactions yet.</div>';
        return;
    }

    list.innerHTML = transactions.map(tx => {
        const amount = Number(tx.amount).toLocaleString("en-IN");

        return `
            <div class="transaction">
                <div>
                    <div class="type ${tx.type.toLowerCase()}">
                        ${tx.type}
                    </div>

                    <div class="date">
                        ${tx.date}
                    </div>

                    <div class="status">
                        ${tx.status}
                    </div>
                </div>

                <div class="amount ${tx.type.toLowerCase()}">
                    ${tx.type === "Deposit" ? "+ " : "- "}₹${amount}
                </div>
            </div>
        `;
    }).join("");
}

loadTransactions();
</script>

</body>
</html>
