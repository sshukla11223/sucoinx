<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SUCOIN X - Login</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 20px;
  font-size: 24px;
  font-weight: bold;
}

.container {
  max-width: 450px;
  margin: 50px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h1 {
  margin-bottom: 10px;
}

.subtitle {
  color: #6b7280;
  margin-bottom: 25px;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 7px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 20px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.switch {
  text-align: center;
  margin-top: 20px;
  color: #2563eb;
  cursor: pointer;
}

.message {
  margin-top: 15px;
  text-align: center;
  font-weight: bold;
}
</style>
</head>

<body>

<header>SUCOIN X</header>

<div class="container">

  <div class="card">

    <h1 id="title">Login</h1>

    <p class="subtitle">
      Login to your SUCOIN X account
    </p>

    <div id="nameBox" style="display:none;">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Enter your name">
    </div>

    <label>Email</label>
    <input type="email" id="email" placeholder="Enter email">

    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password">

    <button onclick="submitForm()" id="submitBtn">
      Login
    </button>

    <div class="switch" onclick="toggleMode()" id="switchText">
      Don't have an account? Sign Up
    </div>

    <div class="message" id="message"></div>

  </div>

</div>

<script>

let signupMode = false;

function toggleMode() {

  signupMode = !signupMode;

  document.getElementById("title").textContent =
    signupMode ? "Create Account" : "Login";

  document.getElementById("nameBox").style.display =
    signupMode ? "block" : "none";

  document.getElementById("submitBtn").textContent =
    signupMode ? "Create Account" : "Login";

  document.getElementById("switchText").textContent =
    signupMode
    ? "Already have an account? Login"
    : "Don't have an account? Sign Up";

  document.getElementById("message").textContent = "";
}

function submitForm() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  if (!email || !password) {
    message.textContent = "Please fill all required fields.";
    return;
  }

  if (signupMode) {

    const name = document.getElementById("name").value;

    if (!name) {
      message.textContent = "Please enter your name.";
      return;
    }

    message.textContent =
      "Demo account created successfully.";

} else {

    window.location.href = "index.html";

  }
}

</script>

</body>
</html>
